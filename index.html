<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Jxo Search</title>
  <style>
    :root {
      --bg: #000000;
      --bg-2: #080808;
      --surface: rgba(24,24,27,.86);
      --surface-solid: #18181b;
      --surface-hover: rgba(255,255,255,.08);
      --text: #f5f5f5;
      --muted: #a1a1aa;
      --subtle: #71717a;
      --line: rgba(255,255,255,.10);
      --accent: #8ab4f8;
      --search: #202124;
      --search-border: rgba(255,255,255,.12);
      --shadow: 0 20px 70px rgba(0,0,0,.40);
      --radius: 28px;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
      transition: background .35s ease;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .wallpaper {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: var(--bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image .35s ease, filter .35s ease;
    }
    .wallpaper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.58));
      pointer-events: none;
    }
    .scrim {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 50% 25%, rgba(255,255,255,.045), transparent 38%),
                  linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.30));
      pointer-events: none;
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 18px;
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 100;
    }

    .top-icon,
    .avatar-btn,
    .sign-in {
      border: 0;
      cursor: pointer;
    }

    .top-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: transparent;
      transition: background .2s ease, transform .2s ease;
    }
    .top-icon:hover { background: var(--surface-hover); transform: translateY(-1px); }
    .top-icon svg { width: 21px; height: 21px; fill: currentColor; }

    .sign-in {
      height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      background: #fff;
      color: #111;
      font-weight: 700;
      transition: transform .2s ease, opacity .2s ease;
    }
    .sign-in:hover { transform: translateY(-1px); opacity: .93; }

    .avatar-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      background: #27272a;
      padding: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,.12);
    }
    .avatar-btn img,
    .panel-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      background: linear-gradient(135deg,#3f3f46,#18181b);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 17vh 20px 70px;
    }

    .home {
      width: min(100%, 860px);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform .4s ease, opacity .3s ease;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 34px;
    }
    .brand img {
      width: min(290px, 65vw);
      max-height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 12px 34px rgba(0,0,0,.35));
      user-select: none;
    }

    .search-wrap {
      width: min(100%, 720px);
      position: relative;
    }
    .search-box {
      height: 62px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 9px 0 21px;
      background: rgba(32,33,36,.94);
      border: 1px solid var(--search-border);
      border-radius: 31px;
      box-shadow: 0 8px 28px rgba(0,0,0,.24);
      backdrop-filter: blur(16px);
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .search-box:focus-within {
      border-color: rgba(138,180,248,.42);
      box-shadow: 0 12px 38px rgba(0,0,0,.32), 0 0 0 3px rgba(138,180,248,.10);
      background: rgba(40,41,44,.98);
    }

    .search-icon {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      color: #9aa0a6;
    }
    .search-icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    .search-input {
      min-width: 0;
      flex: 1;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 17px;
    }
    .search-input::placeholder { color: #a1a1aa; }

    .clear-btn {
      display: none;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      color: #b4b4b8;
    }
    .clear-btn:hover { background: rgba(255,255,255,.07); }

    .ai-btn {
      height: 42px;
      border: 1px solid rgba(138,180,248,.22);
      border-radius: 22px;
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(232,240,254,.96), rgba(210,227,252,.96));
      color: #174ea6;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }
    .ai-btn svg { width: 15px; height: 15px; fill: currentColor; }

    .shortcuts {
      width: 100%;
      margin-top: 28px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .shortcut {
      width: 96px;
      min-height: 100px;
      border: 0;
      background: transparent;
      border-radius: 17px;
      padding: 12px 8px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      position: relative;
      transition: background .18s ease, transform .18s ease;
    }
    .shortcut:hover { background: rgba(255,255,255,.065); transform: translateY(-2px); }

    .shortcut-icon {
      width: 54px;
      height: 54px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: rgba(25,25,27,.82);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 7px 20px rgba(0,0,0,.18);
      font-weight: 800;
      font-size: 19px;
    }
    .shortcut-icon img { width: 100%; height: 100%; object-fit: cover; }
    .shortcut-name {
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
      font-size: 12px;
      color: #e4e4e7;
    }
    .shortcut-remove {
      position: absolute;
      right: 7px;
      top: 5px;
      width: 22px;
      height: 22px;
      border: 0;
      border-radius: 50%;
      background: #27272a;
      color: #fff;
      display: none;
      place-items: center;
      cursor: pointer;
      z-index: 2;
    }
    .shortcut:hover .shortcut-remove { display: grid; }

    .customize {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 50;
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(24,24,27,.82);
      backdrop-filter: blur(12px);
      cursor: pointer;
      color: #f4f4f5;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0,0,0,.18);
    }
    .customize:hover { background: rgba(39,39,42,.95); }

    .results-view {
      display: none;
      width: min(100%, 900px);
      align-self: flex-start;
      padding: 92px 0 60px 6vw;
    }
    body.results .page {
      align-items: flex-start;
      padding: 0;
      min-height: 100vh;
    }
    body.results .home {
      display: none;
    }
    body.results .results-view { display: block; }

    .results-search {
      width: min(100%, 720px);
      margin-bottom: 34px;
    }
    .results-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 13px;
    }
    .result-item {
      max-width: 730px;
      margin: 0 0 29px;
    }
    .result-source {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #c7c7cc;
      font-size: 13px;
      margin-bottom: 5px;
    }
    .source-dot {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: #27272a;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      overflow: hidden;
    }
    .source-dot img { width: 100%; height: 100%; object-fit: cover; }
    .result-title {
      display: inline-block;
      color: #8ab4f8;
      text-decoration: none;
      font-size: 21px;
      line-height: 1.3;
      margin-bottom: 5px;
    }
    .result-title:hover { text-decoration: underline; }
    .result-url { color: #a1a1aa; font-size: 12px; margin-bottom: 4px; overflow-wrap: anywhere; }
    .result-desc { color: #c4c4c9; line-height: 1.55; font-size: 14px; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0,0,0,.56);
      backdrop-filter: blur(5px);
      display: none;
    }
    .overlay.open { display: block; }

    .panel {
      position: fixed;
      top: 64px;
      right: 16px;
      z-index: 700;
      width: 360px;
      max-width: calc(100vw - 28px);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 22px;
      background: rgba(24,24,27,.97);
      box-shadow: var(--shadow);
      display: none;
      overflow: hidden;
    }
    .panel.open { display: block; }

    .panel-inner { padding: 16px; }
    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #a1a1aa;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .close-x {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      color: #e4e4e7;
      font-size: 20px;
    }
    .close-x:hover { background: rgba(255,255,255,.08); }

    .user-card {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      border-radius: 17px;
      background: #111113;
      border: 1px solid rgba(255,255,255,.06);
    }
    .panel-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      overflow: hidden;
      background: #27272a;
      flex: 0 0 auto;
    }
    .user-meta { min-width: 0; }
    .user-name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user-email { margin-top: 3px; color: #a1a1aa; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .panel-action {
      width: 100%;
      margin-top: 9px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: #27272a;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .panel-action:hover { background: #3f3f46; }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .app-item {
      padding: 11px 6px;
      border-radius: 15px;
      text-decoration: none;
      color: inherit;
      text-align: center;
      transition: background .18s ease;
    }
    .app-item:hover { background: rgba(255,255,255,.07); }
    .app-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 8px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-weight: 800;
      background: #27272a;
    }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; }
    .app-label { font-size: 12px; color: #e4e4e7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .modal {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 800;
      width: min(560px, calc(100vw - 28px));
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 24px;
      background: rgba(24,24,27,.98);
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
      display: none;
      overflow: hidden;
    }
    .modal.open { display: block; }
    .modal-head {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .modal-body { padding: 18px 20px 20px; }
    .modal-sub { margin: 0 0 14px; color: #a1a1aa; font-size: 12px; line-height: 1.5; }

    .wallpaper-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-height: 320px;
      overflow: auto;
      padding-right: 3px;
    }
    .wall {
      min-height: 92px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: #09090b;
      background-size: cover;
      background-position: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .17s ease, border-color .17s ease;
    }
    .wall:hover { transform: scale(1.015); }
    .wall.active { border-color: #8ab4f8; }
    .wall span {
      position: absolute;
      left: 9px;
      bottom: 8px;
      padding: 4px 7px;
      border-radius: 7px;
      background: rgba(0,0,0,.54);
      font-size: 11px;
      font-weight: 700;
    }

    .input {
      width: 100%;
      height: 44px;
      border: 1px solid #3f3f46;
      outline: none;
      border-radius: 12px;
      background: #111113;
      color: #fff;
      padding: 0 13px;
      margin-top: 14px;
    }
    .input:focus { border-color: rgba(138,180,248,.65); }

    .modal-foot {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-btn {
      height: 40px;
      border-radius: 999px;
      padding: 0 15px;
      border: 0;
      cursor: pointer;
      font-weight: 700;
    }
    .modal-btn.secondary { background: transparent; color: #8ab4f8; }
    .modal-btn.primary { background: #8ab4f8; color: #101010; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 12px);
      z-index: 1000;
      background: #27272a;
      color: #fff;
      padding: 11px 14px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
      font-size: 13px;
    }
    .toast.show { opacity: 1; transform: translate(-50%,0); }

    @media (max-width: 720px) {
      .page { padding-top: 15vh; }
      .brand img { width: 230px; }
      .search-box { height: 58px; }
      .ai-btn { padding: 0 12px; }
      .ai-btn span { display: none; }
      .shortcuts { gap: 4px; }
      .shortcut { width: 84px; }
      .results-view { padding: 88px 20px 50px; }
      .results-search { width: 100%; }
      .wallpaper-grid { grid-template-columns: repeat(2,1fr); }
    }
  </style>
</head>
<body>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="scrim"></div>

  <header class="topbar">
    <button class="top-icon" id="appsBtn" title="Jxo apps" aria-label="Jxo apps">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 5h3v3H5V5zm5.5 0h3v3h-3V5zM16 5h3v3h-3V5zM5 10.5h3v3H5v-3zm5.5 0h3v3h-3v-3zm5.5 0h3v3h-3v-3zM5 16h3v3H5v-3zm5.5 0h3v3h-3v-3zm5.5 0h3v3h-3v-3z"/>
      </svg>
    </button>
    <div id="accountArea"></div>
  </header>

  <div class="panel" id="appsPanel">
    <div class="panel-inner">
      <div class="panel-title">Jxo apps <button class="close-x" data-close="appsPanel">&times;</button></div>
      <div class="apps-grid" id="appsGrid"></div>
    </div>
  </div>

  <div class="panel" id="accountPanel">
    <div class="panel-inner">
      <div class="panel-title">Jxo Account <button class="close-x" data-close="accountPanel">&times;</button></div>
      <div class="user-card">
        <div class="panel-avatar" id="panelAvatar"></div>
        <div class="user-meta">
          <div class="user-name" id="panelName">Jxo User</div>
          <div class="user-email" id="panelEmail"></div>
        </div>
      </div>
      <button class="panel-action" id="manageBtn">Manage your Jxo Account</button>
    </div>
  </div>

  <main class="page">
    <section class="home" id="home">
      <div class="brand">
        <img src="https://jxoj.github.io/Jxo/assets/jxo.png" alt="Jxo">
      </div>

      <div class="search-wrap">
        <div class="search-box">
          <div class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"></circle><path d="m16.5 16.5 4.2 4.2"></path></svg>
          </div>
          <input id="searchInput" class="search-input" type="search" placeholder="Search Jxo or type a URL" autocomplete="off" spellcheck="false">
          <button id="clearBtn" class="clear-btn" aria-label="Clear search">&times;</button>
          <button id="aiBtn" class="ai-btn" type="button" title="AI Mode">
            <svg viewBox="0 0 24 24"><path d="M12 2.4 14.4 9.6 21.6 12l-7.2 2.4L12 21.6 9.6 14.4 2.4 12l7.2-2.4L12 2.4z"></path></svg>
            <span>AI Mode</span>
          </button>
        </div>
      </div>

      <div class="shortcuts" id="shortcuts"></div>
    </section>

    <section class="results-view" id="resultsView">
      <div class="results-search">
        <div class="search-box">
          <div class="search-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7.5"></circle><path d="m16.5 16.5 4.2 4.2"></path></svg>
          </div>
          <input id="resultsSearchInput" class="search-input" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
          <button id="resultsClearBtn" class="clear-btn" aria-label="Clear search">&times;</button>
        </div>
      </div>
      <div class="results-toolbar" id="resultsToolbar">Results</div>
      <div id="resultsList"></div>
    </section>
  </main>

  <button class="customize" id="customizeBtn">Customize</button>

  <div class="overlay" id="overlay"></div>

  <div class="modal" id="wallpaperModal">
    <div class="modal-head">
      <h2>Customize background</h2>
      <button class="close-x" data-close="wallpaperModal">&times;</button>
    </div>
    <div class="modal-body">
      <p class="modal-sub">Your selected background is saved in this browser and, when signed in, to your Jxo app account.</p>
      <div class="wallpaper-grid" id="wallpaperGrid"></div>
      <input id="customWallpaperInput" class="input" placeholder="Paste a custom image URL">
      <div class="modal-foot">
        <button class="modal-btn secondary" id="cancelWallpaper">Cancel</button>
        <button class="modal-btn primary" id="applyCustomWallpaper">Use URL</button>
      </div>
    </div>
  </div>

  <div class="modal" id="shortcutModal">
    <div class="modal-head">
      <h2>Add shortcut</h2>
      <button class="close-x" data-close="shortcutModal">&times;</button>
    </div>
    <div class="modal-body">
      <input id="shortcutName" class="input" style="margin-top:0" placeholder="Name">
      <input id="shortcutUrl" class="input" placeholder="https://example.com">
      <div class="modal-foot">
        <button class="modal-btn secondary" id="cancelShortcut">Cancel</button>
        <button class="modal-btn primary" id="saveShortcut">Add</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://jxoj.github.io/Jxo/sdk.js"></script>
  <script>
    "use strict";

    const APP_ID = "com.jxo.search";
    const STORAGE_KEY = "jxo-search-settings-v2";
    const SHORTCUTS_KEY = "jxo-search-shortcuts-v2";

    // Keep the existing Google Custom Search configuration used by this page.
    const GOOGLE_API_KEY = "AIzaSyB55B9TOOSy1IcIr4AO0ibpqilV9Hpw4P4";
    const GOOGLE_CX = "d4ae4a6121f9c4d65";

    const wallpapers = [
      { id: "default", name: "Black", url: "" },
      { id: "midnight", name: "Midnight", url: "linear-gradient(135deg,#020617,#0f172a 52%,#111827)" },
      { id: "ocean", name: "Ocean", url: "linear-gradient(135deg,#00111c,#003b5c 48%,#07111f)" },
      { id: "violet", name: "Violet", url: "linear-gradient(135deg,#12051f,#32105b 52%,#0b1020)" },
      { id: "ember", name: "Ember", url: "linear-gradient(135deg,#160806,#4a160d 50%,#120d0a)" },
      { id: "aurora", name: "Aurora", url: "linear-gradient(135deg,#031b18,#0d4f4a 42%,#25124f 100%)" },
      { id: "space", name: "Space", url: "https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1920&q=85" },
      { id: "mountains", name: "Mountains", url: "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1920&q=85" },
      { id: "night-city", name: "Night City", url: "https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1920&q=85" }
    ];

    let currentUser = null;
    let appData = {};
    let shortcuts = [];
    let currentWallpaper = "default";

    const $ = id => document.getElementById(id);
    const wallpaperEl = $("wallpaper");
    const overlay = $("overlay");

    function safeText(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function loadLocalSettings() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        currentWallpaper = saved.wallpaper || "default";
        const localShortcuts = JSON.parse(localStorage.getItem(SHORTCUTS_KEY) || "[]");
        if (Array.isArray(localShortcuts)) shortcuts = localShortcuts;
      } catch {
        currentWallpaper = "default";
        shortcuts = [];
      }
      applyWallpaper(currentWallpaper);
    }

    function saveLocalSettings() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          wallpaper: currentWallpaper
        }));
        localStorage.setItem(SHORTCUTS_KEY, JSON.stringify(shortcuts));
      } catch (error) {
        console.warn("Unable to save local settings:", error);
      }
    }

    async function saveJxoData() {
      if (!currentUser || typeof Jxo === "undefined" || !Jxo.isAuthenticated()) return;

      try {
        await Jxo.updateAppData({
          ...appData,
          wallpaper: currentWallpaper,
          shortcuts
        });
      } catch (error) {
        console.warn("Jxo app data save failed:", error);
      }
    }

    async function syncSettings() {
      saveLocalSettings();
      await saveJxoData();
    }

    function getWallpaper(idOrUrl) {
      return wallpapers.find(w => w.id === idOrUrl) || null;
    }

    function applyWallpaper(idOrUrl) {
      const builtIn = getWallpaper(idOrUrl);

      if (builtIn) {
        currentWallpaper = builtIn.id;
        if (!builtIn.url) {
          wallpaperEl.style.background = "#000";
        } else if (builtIn.url.startsWith("linear-gradient")) {
          wallpaperEl.style.background = builtIn.url;
        } else {
          wallpaperEl.style.backgroundImage = `url("${builtIn.url}")`;
          wallpaperEl.style.backgroundColor = "#000";
        }
      } else if (typeof idOrUrl === "string" && idOrUrl.trim()) {
        currentWallpaper = idOrUrl.trim();
        wallpaperEl.style.backgroundImage = `url("${idOrUrl.replaceAll('"', '%22')}")`;
        wallpaperEl.style.backgroundColor = "#000";
      } else {
        currentWallpaper = "default";
        wallpaperEl.style.background = "#000";
      }
    }

    function avatarMarkup(user, extraClass = "") {
      const fallback = safeText((user?.displayName || user?.email || "J").trim().charAt(0).toUpperCase() || "J");
      const photo = user?.photoURL;
      if (!photo) return `<div class="avatar-fallback ${extraClass}">${fallback}</div>`;
      return `<img class="${extraClass}" src="${safeText(photo)}" alt="Profile" referrerpolicy="no-referrer" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="avatar-fallback" style="display:none">${fallback}</span>`;
    }

    function updateAccountUI() {
      const accountArea = $("accountArea");

      if (!currentUser) {
        accountArea.innerHTML = '<button class="sign-in" id="loginBtn">Sign in</button>';
        $("loginBtn").addEventListener("click", () => {
          if (typeof Jxo !== "undefined") Jxo.login();
        });
        return;
      }

      accountArea.innerHTML = `
        <button class="avatar-btn" id="profileBtn" aria-label="Jxo account">
          ${avatarMarkup(currentUser)}
        </button>
      `;

      $("panelAvatar").innerHTML = avatarMarkup(currentUser);
      $("panelName").textContent = currentUser.displayName || "Jxo User";
      $("panelEmail").textContent = currentUser.email || "";

      $("profileBtn").addEventListener("click", e => {
        e.stopPropagation();
        $("accountPanel").classList.toggle("open");
        $("appsPanel").classList.remove("open");
      });
    }

    async function loadJxoAccount() {
      if (typeof Jxo === "undefined") return;

      try {
        // Current official SDK accepts the app ID as the init argument.
        await Jxo.init(APP_ID);
        currentUser = Jxo.getUser();

        if (currentUser && Jxo.isAuthenticated()) {
          const remote = await Jxo.getAppData();
          if (remote && typeof remote === "object") {
            appData = remote;
            if (typeof remote.wallpaper === "string" && remote.wallpaper.trim()) {
              currentWallpaper = remote.wallpaper;
            }
            if (Array.isArray(remote.shortcuts)) {
              shortcuts = remote.shortcuts;
            }
            saveLocalSettings();
            applyWallpaper(currentWallpaper);
          }
        }
      } catch (error) {
        console.warn("Jxo initialization failed:", error);
      }

      updateAccountUI();
      renderShortcuts();
    }

    async function loadApps() {
      try {
        const response = await fetch("assets/apps.json", { cache: "no-store" });
        if (!response.ok) throw new Error("apps.json unavailable");
        const apps = await response.json();

        if (!Array.isArray(apps) || !apps.length) throw new Error("No apps");

        $("appsGrid").innerHTML = apps.map(app => {
          const name = safeText(app.name || "App");
          const url = safeText(app.url || "#");
          const icon = app.icon ? `<img src="${safeText(app.icon)}" alt="">` : safeText(app.initial || (app.name || "A").charAt(0).toUpperCase());
          const color = safeText(app.color || "#27272a");
          return `
            <a class="app-item" href="${url}" target="_blank" rel="noopener">
              <div class="app-icon" style="background:${color}">${icon}</div>
              <div class="app-label">${name}</div>
            </a>
          `;
        }).join("");
      } catch {
        $("appsGrid").innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#a1a1aa;font-size:13px;padding:18px 0">No apps available</div>';
      }
    }

    function renderShortcuts() {
      const grid = $("shortcuts");
      grid.innerHTML = "";

      shortcuts.forEach((shortcut, index) => {
        const a = document.createElement("a");
        a.className = "shortcut";
        a.href = shortcut.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.innerHTML = `
          <button class="shortcut-remove" type="button" title="Remove" data-index="${index}">&times;</button>
          <div class="shortcut-icon">${safeText((shortcut.name || "S").charAt(0).toUpperCase())}</div>
          <div class="shortcut-name">${safeText(shortcut.name || "Shortcut")}</div>
        `;
        grid.appendChild(a);
      });

      const add = document.createElement("button");
      add.className = "shortcut";
      add.type = "button";
      add.innerHTML = `
        <div class="shortcut-icon" style="font-size:25px;color:#d4d4d8">+</div>
        <div class="shortcut-name">Add shortcut</div>
      `;
      add.addEventListener("click", () => openModal("shortcutModal"));
      grid.appendChild(add);

      grid.querySelectorAll(".shortcut-remove").forEach(btn => {
        btn.addEventListener("click", async event => {
          event.preventDefault();
          event.stopPropagation();
          shortcuts.splice(Number(btn.dataset.index), 1);
          renderShortcuts();
          await syncSettings();
        });
      });
    }

    function renderWallpaperOptions() {
      const grid = $("wallpaperGrid");
      grid.innerHTML = "";

      wallpapers.forEach(wall => {
        const option = document.createElement("button");
        option.type = "button";
        option.className = `wall ${currentWallpaper === wall.id ? "active" : ""}`;
        option.title = wall.name;
        option.style.background = wall.url
          ? (wall.url.startsWith("linear-gradient") ? wall.url : `url("${wall.url}") center / cover`)
          : "#000";
        option.innerHTML = `<span>${safeText(wall.name)}</span>`;

        option.addEventListener("click", async () => {
          currentWallpaper = wall.id;
          applyWallpaper(currentWallpaper);
          renderWallpaperOptions();
          await syncSettings();
          showToast("Background saved");
        });

        grid.appendChild(option);
      });
    }

    function openModal(id) {
      closeMenus();
      overlay.classList.add("open");
      $(id).classList.add("open");
      if (id === "wallpaperModal") renderWallpaperOptions();
    }

    function closeModals() {
      document.querySelectorAll(".modal.open").forEach(el => el.classList.remove("open"));
      overlay.classList.remove("open");
    }

    function closeMenus() {
      $("appsPanel").classList.remove("open");
      $("accountPanel").classList.remove("open");
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function formatResultUrl(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch {
        return "";
      }
    }

    function resultIcon(item) {
      const domain = formatResultUrl(item.link || "");
      return domain
        ? `<div class="source-dot">${safeText(domain.charAt(0).toUpperCase())}</div>`
        : `<div class="source-dot">J</div>`;
    }

    function enterResults(query) {
      document.body.classList.add("results");
      $("resultsSearchInput").value = query;
      $("resultsClearBtn").style.display = query ? "grid" : "none";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function performSearch(rawQuery) {
      const query = rawQuery.trim();
      if (!query) return;

      if (/^(https?:\/\/|www\.)/i.test(query)) {
        const url = query.startsWith("http") ? query : `https://${query}`;
        window.location.href = url;
        return;
      }

      enterResults(query);
      $("resultsList").innerHTML = '<div style="color:#8ab4f8;padding:10px 0">Searching Jxo…</div>';
      $("resultsToolbar").textContent = "Searching";

      try {
        const url = `https://www.googleapis.com/customsearch/v1?key=${encodeURIComponent(GOOGLE_API_KEY)}&cx=${encodeURIComponent(GOOGLE_CX)}&q=${encodeURIComponent(query)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data?.error?.message || "Search request failed");
        }

        const items = Array.isArray(data.items) ? data.items : [];
        $("resultsToolbar").textContent = items.length ? `${items.length} results` : "No results";

        if (!items.length) {
          $("resultsList").innerHTML = `
            <div class="result-item">
              <div class="result-desc">No results found for “${safeText(query)}”.</div>
            </div>
          `;
          return;
        }

        $("resultsList").innerHTML = items.map(item => {
          const title = item.htmlTitle || item.title || "Untitled result";
          const snippet = item.htmlSnippet || item.snippet || "";
          const displayLink = item.displayLink || formatResultUrl(item.link || "");
          return `
            <article class="result-item">
              <div class="result-source">
                ${resultIcon(item)}
                <span>${safeText(displayLink)}</span>
              </div>
              <a class="result-title" href="${safeText(item.link || "#")}" target="_blank" rel="noopener">${title}</a>
              <div class="result-url">${safeText(item.formattedUrl || item.link || "")}</div>
              <div class="result-desc">${snippet}</div>
            </article>
          `;
        }).join("");
      } catch (error) {
        $("resultsToolbar").textContent = "Search error";
        $("resultsList").innerHTML = `
          <div class="result-item">
            <div class="result-desc">
              Search could not be completed. ${safeText(error.message || "Please try again.")}
            </div>
          </div>
        `;
      }
    }

    function wireSearch(inputId, clearId) {
      const input = $(inputId);
      const clear = $(clearId);

      input.addEventListener("input", () => {
        clear.style.display = input.value ? "grid" : "none";
      });

      input.addEventListener("keydown", e => {
        if (e.key === "Enter") performSearch(input.value);
        if (e.key === "Escape") {
          input.value = "";
          clear.style.display = "none";
        }
      });

      clear.addEventListener("click", () => {
        input.value = "";
        clear.style.display = "none";
        input.focus();
      });
    }

    $("appsBtn").addEventListener("click", e => {
      e.stopPropagation();
      $("appsPanel").classList.toggle("open");
      $("accountPanel").classList.remove("open");
    });

    $("customizeBtn").addEventListener("click", () => openModal("wallpaperModal"));

    $("cancelWallpaper").addEventListener("click", closeModals);
    $("cancelShortcut").addEventListener("click", closeModals);
    overlay.addEventListener("click", closeModals);

    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.close;
        if ($(id).classList.contains("modal")) closeModals();
        else $(id).classList.remove("open");
        if (![...document.querySelectorAll(".modal.open")].length) overlay.classList.remove("open");
      });
    });

    $("manageBtn").addEventListener("click", () => {
      if (typeof Jxo !== "undefined") Jxo.openAccountManager();
    });

    $("applyCustomWallpaper").addEventListener("click", async () => {
      const url = $("customWallpaperInput").value.trim();
      if (!url) return;

      currentWallpaper = url;
      applyWallpaper(currentWallpaper);
      await syncSettings();
      $("customWallpaperInput").value = "";
      closeModals();
      showToast("Custom background saved");
    });

    $("saveShortcut").addEventListener("click", async () => {
      const name = $("shortcutName").value.trim();
      let url = $("shortcutUrl").value.trim();

      if (!name || !url) return;
      if (!/^https?:\/\//i.test(url)) url = `https://${url}`;

      shortcuts.push({ name, url });
      renderShortcuts();
      await syncSettings();

      $("shortcutName").value = "";
      $("shortcutUrl").value = "";
      closeModals();
      showToast("Shortcut added");
    });

    $("aiBtn").addEventListener("click", () => {
      window.location.href = "https://jxoj.github.io/Ozo/";
    });

    document.addEventListener("click", e => {
      if (!e.target.closest("#appsPanel") && !e.target.closest("#appsBtn") &&
          !e.target.closest("#accountPanel") && !e.target.closest("#profileBtn")) {
        closeMenus();
      }
    });

    wireSearch("searchInput", "clearBtn");
    wireSearch("resultsSearchInput", "resultsClearBtn");

    // Initialize local settings immediately so the page is black even before Jxo loads.
    loadLocalSettings();
    renderShortcuts();
    loadApps();
    loadJxoAccount();
  </script>
</body>
</html>
