<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Jxo Safe Domains</title>
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
	<style>body{margin:0;background:#09090b;color:#f4f4f5;font:16px/1.6 system-ui,sans-serif}main{max-width:760px;margin:0 auto;padding:40px 22px}a{color:#8ab4f8}code{background:#18181b;padding:2px 5px;border-radius:4px}</style>
</head>
<body><main id="content">Loading...</main>
<script>
	fetch("sd.md", { cache: "no-store" })
		.then(response => { if (!response.ok) throw new Error("Unable to load safe domains"); return response.text(); })
		.then(markdown => { document.getElementById("content").innerHTML = marked.parse(markdown); })
		.catch(error => { document.getElementById("content").textContent = error.message; });
</script>
</body>
</html>
